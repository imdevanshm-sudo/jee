// --- Main App Component ---

export default function App() {
  const [currentView, setCurrentView] = useState('home');

  useEffect(() => {
    // Inject Tailwind Config directly to ensure custom colors and fonts are applied globally
    if (!document.getElementById('tailwind-config-script')) {
        const script = document.createElement('script');
        script.id = 'tailwind-config-script';
        script.src = "https://cdn.tailwindcss.com?plugins=forms,container-queries";
        script.onload = () => {
          window.tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#ca1c4a",
                  "maroon": "#590D22",
                  "midnight": "#211115",
                  "surface-dark": "#2D181E",
                  "background-light": "#f8f6f6",
                  "background-dark": "#211115",
                  "gold": "#D4AF37",
                  "gold-light": "#FCF6BA",
                  "gold-med": "#BF953F",
                  "gold-dark": "#B38728",
                  "ivory": "#FDFBF7",
                },
                fontFamily: {
                  "display": ["Inter", "sans-serif"],
                  "heading": ["Playfair Display", "serif"],
                  "sub": ["Cormorant Garamond", "serif"],
                  "body": ["Tenor Sans", "sans-serif"],
                  "nav": ["Montserrat", "sans-serif"],
                }
              }
            }
          };
        };
        document.head.appendChild(script);
    }
  }, []);

  // Scroll to top automatically when changing views
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [currentView]);

  const renderView = () => {
    switch(currentView) {
      case 'home': return <HomeView />;
      case 'itinerary': return <ItineraryView setView={setCurrentView} />;
      case 'feast': return <FeastView />;
      case 'rsvp': return <RSVPView />;
      case 'concierge': return <ConciergeView />;
      default: return <HomeView />;
    }
  };

  return (
    <div className="min-h-screen bg-[#211115] text-[#FDFBF7] font-display antialiased flex flex-col relative overflow-x-hidden selection:bg-[#ca1c4a] selection:text-white dark">
      <GlobalStyles />
      
      {/* Background Texture - Present everywhere */}
      <div className="fixed inset-0 opacity-10 pointer-events-none z-0" style={{backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4AF37' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")"}}></div>

      {/* Main Content Area */}
      {renderView()}

      {/* Unified Global Floating Navigation */}
      <nav className="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-50 animate-reveal" style={{ animationDelay: '0.6s' }}>
        <div className="flex items-center gap-1 sm:gap-2 md:gap-4 p-1 sm:p-1.5 md:p-2 rounded-full border border-gold/30 bg-[#211216]/80 backdrop-blur-xl shadow-[0_10px_30px_-10px_rgba(212,175,55,0.3)]">
          
          {[
            { id: 'home', icon: 'temple_hindu', label: 'Home' },
            { id: 'itinerary', icon: 'calendar_month', label: 'Events' },
            { id: 'feast', icon: 'restaurant_menu', label: 'Feast' },
            { id: 'rsvp', icon: 'mark_email_unread', label: 'RSVP' },
            { id: 'concierge', icon: 'concierge', label: 'Help' },
          ].map(navItem => {
            const isActive = currentView === navItem.id;
            return (
              <button 
                key={navItem.id}
                onClick={() => setCurrentView(navItem.id)}
                className={`group flex flex-col items-center justify-center transition-all duration-300 relative overflow-hidden
                  ${isActive 
                    ? 'w-[52px] h-[52px] sm:w-16 sm:h-16 md:w-20 md:h-20 rounded-full bg-[#590D22] border border-[#D4AF37] shadow-lg flex-shrink-0' 
                    : 'w-[44px] h-[44px] sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-full hover:bg-white/10 text-[#FDFBF7]/70 hover:text-[#D4AF37] flex-shrink-0'
                  }`}
              >
                {isActive && <div className="absolute inset-0 bg-gold-gradient opacity-10"></div>}
                
                <span className={`material-symbols-outlined text-xl sm:text-2xl md:text-3xl relative z-10 transition-transform ${isActive ? 'text-[#D4AF37]' : 'mb-0.5 sm:mb-1 group-hover:scale-110'}`}>
                  {navItem.icon}
                </span>
                
                <span className={`text-[8px] sm:text-[9px] md:text-[10px] uppercase tracking-wider font-nav relative z-10 mt-0.5 sm:mt-1 transition-colors
                  ${isActive ? 'text-[#D4AF37] font-bold block' : 'block md:hidden lg:block group-hover:block'}
                `}>
                  {navItem.label}
                </span>
              </button>
            )
          })}
        </div>
      </nav>

    </div>
  );
}
